name: Build Kernel Universal

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "URL repo source kernel"
        required: true
        type: string
        default: ""
      KERNEL_BRANCH:
        description: "Branch source kernel"
        required: true
        type: string
        default: "old/main-dynamic"
      KERNEL_CONFIG:
        description: "Defconfig dasar (relatif ke arch/<arch>/configs), mis. vendor/xiaomi/sdm660_defconfig atau lavender_defconfig"
        required: true
        type: string
        default: ""
      KERNEL_FRAGMENT:
        description: "Fragment config (pisahkan spasi, kosongkan jika tidak ada), mis. vendor/xiaomi/lavender.config"
        required: false
        type: string
        default: ""
      KERNEL_NAME:
        description: "Nama kernel (untuk penamaan file)"
        required: true
        type: string
        default: "Southwest"
      CODENAME:
        description: "Codename device (contoh: lavender, surya, ginkgo)"
        required: true
        type: string
        default: "lavender"
      TARGET_ARCH:
        description: "Arsitektur target"
        required: true
        type: choice
        options: [arm64, arm]
        default: arm64
      RUNNER:
        description: "OS runner (Gunakan ubuntu-22.04 untuk Clang 11-13 / kernel 4.4/4.9)"
        required: true
        type: choice
        options: [ubuntu-24.04, ubuntu-22.04]
        default: ubuntu-22.04
      COMPILER:
        description: "Pilih Compiler / Toolchain"
        required: true
        type: choice
        options:
          - zyc-clang-20
          - zyc-clang-19
          - zyc-clang-18
          - zyc-clang-17
          - zyc-clang-16
          - zyc-clang-15
          - zyc-clang-14
          - zyc-clang-13
          - zyc-clang-12
          - zyc-clang-11
          - proton-clang-13
          - aosp-clang-r41637b
          - greenforce-clang
          - clang-22
          - clang-21
          - clang-20
          - clang-19
          - clang-18
          - clang-17
          - clang-16
          - clang-15
          - clang-14
          - clang-13
          - clang-12
          - clang-11
          - custom
        default: zyc-clang-14
      CLANG_CUSTOM_URL:
        description: "Hanya untuk COMPILER=custom: URL archive (.tar.gz / .tar.xz / .zip) atau git repo"
        required: false
        type: string
        default: ""
      CLANG_CUSTOM_BRANCH:
        description: "Hanya untuk custom + git repo: branch/tag (opsional)"
        required: false
        type: string
        default: ""
      LTO_MODE:
        description: "Mode LTO (otomatis dilewati jika source tidak mendukung)"
        required: true
        type: choice
        options: [thin, full, none]
        default: thin
      EXTRA_KCFLAGS:
        description: "KCFLAGS tambahan"
        required: false
        type: string
        default: "-Wno-error"
      EXTRA_MAKE_ARGS:
        description: "Argumen make tambahan, pisahkan spasi (misal: LLVM_IAS=0 untuk kernel 4.4/4.9 + Clang baru)"
        required: false
        type: string
        default: ""
      KSU_VARIANT:
        description: "Varian KernelSU (none = polos, 4.4/4.9 butuh backport manual di source)"
        required: true
        type: choice
        options: [none, xxksu, ksu-next, ksu-original, foxmiko-ksu]
        default: none
      KSU_ENABLE_MODULES:
        description: "Hanya ksu-next/original: aktifkan CONFIG_MODULES & KPROBES"
        required: false
        type: boolean
        default: true
      KSU_PATCH_URL:
        description: "URL patch manual hook KSU (kosongkan untuk auto 4.14/4.19)"
        required: false
        type: string
        default: ""
      MANAGER_AUTO:
        description: "Sertakan APK manager sesuai varian KSU"
        required: true
        type: boolean
        default: true
      MGR_EXTRA:
        description: "Manager ekstra (pisahkan koma: original,next,rksu,kowsu)"
        required: false
        type: string
        default: ""
      BUILD_ANYKERNEL3:
        description: "Kemas zip AnyKernel3"
        required: true
        type: boolean
        default: true
      AK3_REPO:
        description: "URL repo AnyKernel3 milikmu (kosong = AnyKernel3 generik)"
        required: false
        type: string
        default: ""
      AK3_BLOCK:
        description: "Path partisi boot (Qualcomm umumnya /dev/block/bootdevice/by-name/boot)"
        required: false
        type: string
        default: "/dev/block/bootdevice/by-name/boot"
      AK3_SLOT_DEVICE:
        description: "Device A/B slot? (0 = bukan, 1 = ya, auto = deteksi)"
        required: false
        type: choice
        options: ["0", "1", auto]
        default: "0"
      PUBLISH_RELEASE:
        description: "Publikasikan ke GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.RUNNER }}
    timeout-minutes: 180
    env:
      KERNEL_SOURCE: ${{ inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ inputs.KERNEL_CONFIG }}
      KERNEL_FRAGMENT: ${{ inputs.KERNEL_FRAGMENT }}
      KERNEL_NAME: ${{ inputs.KERNEL_NAME }}
      CODENAME: ${{ inputs.CODENAME }}
      TARGET_ARCH: ${{ inputs.TARGET_ARCH }}
      COMPILER: ${{ inputs.COMPILER }}
      CLANG_CUSTOM_URL: ${{ inputs.CLANG_CUSTOM_URL }}
      CLANG_CUSTOM_BRANCH: ${{ inputs.CLANG_CUSTOM_BRANCH }}
      LTO_MODE: ${{ inputs.LTO_MODE }}
      EXTRA_KCFLAGS: ${{ inputs.EXTRA_KCFLAGS }}
      EXTRA_MAKE_ARGS: ${{ inputs.EXTRA_MAKE_ARGS }}
      KSU_VARIANT: ${{ inputs.KSU_VARIANT }}
      KSU_ENABLE_MODULES: ${{ inputs.KSU_ENABLE_MODULES }}
      KSU_PATCH_URL: ${{ inputs.KSU_PATCH_URL }}
      MANAGER_AUTO: ${{ inputs.MANAGER_AUTO }}
      MGR_EXTRA: ${{ inputs.MGR_EXTRA }}
      BUILD_ANYKERNEL3: ${{ inputs.BUILD_ANYKERNEL3 }}
      AK3_REPO: ${{ inputs.AK3_REPO }}
      AK3_BLOCK: ${{ inputs.AK3_BLOCK }}
      AK3_SLOT_DEVICE: ${{ inputs.AK3_SLOT_DEVICE }}
      PUBLISH_RELEASE: ${{ inputs.PUBLISH_RELEASE }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      KBUILD_BUILD_USER: "github-actions"
      KBUILD_BUILD_HOST: "ci"

    steps:
      - name: Catat waktu mulai
        run: echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Telegram - siapkan helper
        if: ${{ env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        run: |
          cat > /tmp/tg.sh <<'EOF'
          API="https://api.telegram.org/bot${BOT_TOKEN}"
          tg_msg() {
            curl -sS -X POST "$API/sendMessage" \
              --data-urlencode chat_id="$CHAT_ID" \
              --data-urlencode text="$1" \
              -d disable_web_page_preview=true -o /tmp/tg_resp.json || true
            jq -e '.ok' /tmp/tg_resp.json >/dev/null 2>&1 \
              || echo "::warning::Telegram menolak pesan: $(cat /tmp/tg_resp.json 2>/dev/null)"
          }
          tg_file() {
            local sz
            sz=$(stat -c %s "$1")
            if [ "$sz" -gt 49000000 ]; then
              tg_msg "File $(basename "$1") terlalu besar untuk Telegram ($((sz/1048576)) MB). Ambil dari Release atau Artifacts."
              return 0
            fi
            curl -sS -X POST "$API/sendDocument" \
              -F chat_id="$CHAT_ID" -F document=@"$1" -F caption="$2" -o /tmp/tg_resp.json || true
            jq -e '.ok' /tmp/tg_resp.json >/dev/null 2>&1 \
              || echo "::warning::Telegram menolak file: $(cat /tmp/tg_resp.json 2>/dev/null)"
          }
          EOF

      - name: Telegram - build dimulai
        if: ${{ env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        continue-on-error: true
        run: |
          source /tmp/tg.sh
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tg_msg "🚀 Build Dimulai
          - Kernel   : ${KERNEL_NAME} (${CODENAME})
          - Source   : ${KERNEL_SOURCE} @ ${KERNEL_BRANCH}
          - Config   : ${KERNEL_CONFIG} ${KERNEL_FRAGMENT}
          - Arch     : ${TARGET_ARCH}
          - Compiler : ${COMPILER}
          - LTO      : ${LTO_MODE}
          - KernelSU : ${KSU_VARIANT}
          - Run      : ${RUN_URL}"

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev cpio zip unzip jq \
            python3 ccache git wget curl lsb-release software-properties-common gnupg \
            device-tree-compiler u-boot-tools lz4 xz-utils rsync zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Install compiler (${{ inputs.COMPILER }})
        run: |
          set -euo pipefail
          mkdir -p toolchain/clang

          case "${COMPILER}" in
            zyc-clang-*)
              V="${COMPILER#zyc-clang-}"
              echo "Mencari dan mengunduh ZyC Clang v${V}..."
              
              URL=$(curl -s "https://api.github.com/repos/ZyCromerZ/Clang/releases" | jq -r --arg v "$V" '
                [ .[] | .assets[]? | select(.name | (contains($v) or contains("-$v.")) and (endswith(".tar.xz") or endswith(".tar.gz") or endswith(".tar.zst"))) ] | .[0].browser_download_url // empty
              ')
              if [ -z "${URL}" ] || [ "${URL}" = "null" ]; then
                URL=$(curl -s "https://api.github.com/repos/ZyCromerZ/Clang/releases/latest" | jq -r --arg v "$V" '
                  [ .assets[]? | select(.name | (contains($v) or contains("-$v.")) and (endswith(".tar.xz") or endswith(".tar.gz") or endswith(".tar.zst"))) ] | .[0].browser_download_url // empty
                ')
              fi

              [ -n "${URL}" ] && [ "${URL}" != "null" ] || { echo "::error::Gagal menemukan URL download untuk ZyC Clang v$V"; exit 1; }
              echo "Mengunduh dari: ${URL}"

              case "$URL" in
                *.tar.xz)        curl -fLsS "$URL" | tar -xJ -C toolchain/clang ;;
                *.tar.gz|*.tgz)  curl -fLsS "$URL" | tar -xz -C toolchain/clang ;;
                *.tar.zst)       curl -fLsS "$URL" | tar --zstd -x -C toolchain/clang ;;
                *)               curl -fLsS "$URL" | tar -x -C toolchain/clang ;;
              esac
              ;;
            proton-clang-13)
              echo "Mengunduh Proton Clang 13..."
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang
              ;;
            aosp-clang-r41637b)
              echo "Mengunduh AOSP Clang r41637b..."
              git clone --depth=1 https://github.com/PoomSmart/aosp-clang.git -b r41637b toolchain/clang || \
              git clone --depth=1 https://github.com/aosp-realm/clang-r41637b.git toolchain/clang
              ;;
            greenforce-clang)
              echo "Mengunduh GreenForce Clang..."
              git clone --depth=1 https://github.com/GreenForce-Project/greenforce_clang.git toolchain/clang || \
              git clone --depth=1 https://github.com/StatiXOS/android_prebuilts_clang_host_linux-x86_clang-r41637b.git toolchain/clang
              ;;
            custom)
              [ -n "${CLANG_CUSTOM_URL}" ] || { echo "::error::COMPILER=custom tapi CLANG_CUSTOM_URL kosong"; exit 1; }
              case "${CLANG_CUSTOM_URL}" in
                *.tar.gz|*.tgz) curl -fLsS "${CLANG_CUSTOM_URL}" | tar -xz -C toolchain/clang ;;
                *.tar.xz)        curl -fLsS "${CLANG_CUSTOM_URL}" | tar -xJ -C toolchain/clang ;;
                *.tar.zst)       curl -fLsS "${CLANG_CUSTOM_URL}" | tar --zstd -x -C toolchain/clang ;;
                *.zip)
                  curl -fLsS -o /tmp/toolchain.zip "${CLANG_CUSTOM_URL}"
                  unzip -q /tmp/toolchain.zip -d toolchain/clang ;;
                *)
                  if [ -n "${CLANG_CUSTOM_BRANCH}" ]; then
                    git clone --depth=1 -b "${CLANG_CUSTOM_BRANCH}" "${CLANG_CUSTOM_URL}" toolchain/clang
                  else
                    git clone --depth=1 "${CLANG_CUSTOM_URL}" toolchain/clang
                  fi ;;
              esac
              ;;
            clang-*)
              V="${COMPILER#clang-}"
              if ! sudo apt-get install -y --no-install-recommends "clang-$V" "lld-$V" "llvm-$V"; then
                wget -q https://apt.llvm.org/llvm.sh
                chmod +x llvm.sh
                sudo ./llvm.sh "$V" all || { echo "::error::clang-$V tidak tersedia. Coba ganti RUNNER atau versi compiler lain."; exit 1; }
              fi
              echo "/usr/lib/llvm-$V/bin" >> "$GITHUB_PATH"
              echo "Menggunakan System Clang $V"
              exit 0
              ;;
          esac

          if [ -d "$PWD/toolchain/clang/bin" ]; then
            CLANG_BIN="$PWD/toolchain/clang/bin"
          else
            CLANG_BIN=$(find "$PWD/toolchain/clang" -maxdepth 4 -type f -name clang | head -n1 | xargs -r dirname)
          fi

          [ -n "${CLANG_BIN}" ] || { echo "::error::Binary clang tidak ditemukan di folder toolchain"; exit 1; }
          echo "${CLANG_BIN}" >> "$GITHUB_PATH"
          echo "Toolchain disiapkan dari: ${CLANG_BIN}"

      - name: Cek toolchain
        run: |
          missing=0
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip \
                   aarch64-linux-gnu-gcc arm-linux-gnueabi-gcc; do
            if command -v "$t" >/dev/null; then echo "ok      $t -> $(command -v "$t")"
            else echo "::error::Tidak ditemukan: $t"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Toolchain tidak lengkap (untuk custom: pastikan bundel memuat lld dan llvm-*)"; exit 1; }
          clang --version | head -1
          ld.lld --version

      - name: Clone source kernel
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          if git submodule status | grep -qE '^-'; then
            git submodule update --init --recursive
          fi
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Deteksi versi kernel dan profil
        working-directory: kernel
        run: |
          set -euo pipefail
          V=$(sed -n 's/^VERSION *= *//p' Makefile | head -n1 | tr -d ' ')
          P=$(sed -n 's/^PATCHLEVEL *= *//p' Makefile | head -n1 | tr -d ' ')
          S=$(sed -n 's/^SUBLEVEL *= *//p' Makefile | head -n1 | tr -d ' ')
          KVER="${V}.${P}"
          echo "KVER=${KVER}" >> "$GITHUB_ENV"
          echo "KFULL=${V}.${P}.${S}" >> "$GITHUB_ENV"
          echo "Versi kernel terdeteksi: ${V}.${P}.${S}"

          # Patch yylloc untuk dtc (kernel 4.4/4.9 + GCC/Clang baru)
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l; do
            if [ -f "$f" ] && grep -q '^YYLTYPE yylloc;' "$f"; then
              sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
              echo "Patch yylloc diterapkan: $f"
            fi
          done

      - name: Terapkan patch manual hook KSU
        if: ${{ inputs.KSU_VARIANT == 'ksu-next' || inputs.KSU_VARIANT == 'ksu-original' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          URL="${KSU_PATCH_URL:-}"
          if [ -z "$URL" ]; then
            case "$KVER" in
              4.14|4.19)
                URL="https://raw.githubusercontent.com/kucingoranye/kernel_patches/main/manual_hook-rksu-ksun/kernel-4.19_5.4.patch" ;;
              *)
                echo "::warning::Tidak ada patch bawaan KSU untuk kernel ${KVER}. Melewati tahap patch."
                exit 0 ;;
            esac
          fi
          echo "Mengunduh patch KSU: $URL"
          curl -fLsS -o /tmp/ksun.patch "$URL"
          patch -p1 -N --no-backup-if-mismatch < /tmp/ksun.patch || true

      - name: Validasi config
        working-directory: kernel
        run: |
          CFG_DIR="arch/${TARGET_ARCH}/configs"
          if [ ! -f "$CFG_DIR/$KERNEL_CONFIG" ]; then
            echo "::error::$CFG_DIR/$KERNEL_CONFIG tidak ditemukan"
            exit 1
          fi

      - name: Integrasi KernelSU
        if: ${{ inputs.KSU_VARIANT != 'none' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          if [ -d drivers/kernelsu ] || [ -d KernelSU ] || grep -qi "kernelsu" drivers/Kconfig drivers/Makefile 2>/dev/null; then
            echo "::error::Source ini sudah memuat KernelSU! Pilih KSU_VARIANT=none."
            exit 1
          fi

          case "$KSU_VARIANT" in
            xxksu)
              URL="https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh"
              REF="master"
              bash <(curl -fLsS "$URL") "$REF"
              ;;
            ksu-next)
              URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
              bash <(curl -fLsS "$URL")
              ;;
            ksu-original)
              URL="https://raw.githubusercontent.com/tiann/KernelSU/v0.6.6/kernel/setup.sh"
              REF="v0.6.6"
              bash <(curl -fLsS "$URL") "$REF"
              ;;
            foxmiko-ksu)
              REF="main"
              URL="https://raw.githubusercontent.com/FoxMiko-Labs/KernelSU/${REF}/kernel/setup.sh"
              echo "Mengunduh dan menjalankan skrip dari FoxMiko-Labs/KernelSU..."
              bash <(curl -fLsS "$URL") "$REF"
              ;;
          esac

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          exec > >(tee -a build-full.log) 2>&1
          OUT_DIR=out
          CFG_DIR="arch/${TARGET_ARCH}/configs"

          export ARCH="$TARGET_ARCH" SUBARCH="$TARGET_ARCH"
          MAKE_ARGS=(
            O="$OUT_DIR" ARCH="$TARGET_ARCH" SUBARCH="$TARGET_ARCH"
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          )
          if [ "$TARGET_ARCH" = "arm64" ]; then
            MAKE_ARGS+=(
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              CLANG_TRIPLE=aarch64-linux-gnu-
            )
          else
            MAKE_ARGS+=(
              CROSS_COMPILE=arm-linux-gnueabi-
              CLANG_TRIPLE=arm-linux-gnueabi-
            )
          fi

          # Set KCFLAGS standar universal
          KCFLAGS_COMBINED="-Wno-error"
          if [ -n "$EXTRA_KCFLAGS" ]; then
            KCFLAGS_COMBINED="$KCFLAGS_COMBINED $EXTRA_KCFLAGS"
          fi
          MAKE_ARGS+=(KCFLAGS="$KCFLAGS_COMBINED")

          if [ -n "$EXTRA_MAKE_ARGS" ]; then
            read -r -a EXTRA_ARR <<< "$EXTRA_MAKE_ARGS"
            MAKE_ARGS+=("${EXTRA_ARR[@]}")
          fi

          cfg() { scripts/config --file "$OUT_DIR/.config" "$@"; }

          mkdir -p "$OUT_DIR"
          FILES=("$CFG_DIR/$KERNEL_CONFIG")
          for frag in $KERNEL_FRAGMENT; do
            if [ -n "$frag" ] && [ -f "$CFG_DIR/$frag" ]; then FILES+=("$CFG_DIR/$frag"); fi
          done
          scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" "${FILES[@]}"

          # Nonaktifkan stack protector strong jika compiler tidak mendukung
          cfg -d CC_STACKPROTECTOR_STRONG || true

          # Nonaktifkan zero var init yang diblokir Clang baru/strict
          cfg -d INIT_STACK_ALL_ZERO || true
          cfg -e INIT_STACK_NONE || true

          # Konfigurasi LTO
          if [ "$LTO_MODE" != "none" ] && [ "$TARGET_ARCH" = "arm64" ]; then
            case "$LTO_MODE" in
              thin) cfg -e THINLTO -e LTO_CLANG_THIN -d LTO_CLANG_FULL ;;
              full) cfg -e LTO_CLANG -e LTO_CLANG_FULL -d THINLTO ;;
            esac
          else
            cfg -d LTO_CLANG -d THINLTO -d LTO_CLANG_THIN -d LTO_CLANG_FULL
          fi

          # Konfigurasi KernelSU
          if [ "$KSU_VARIANT" != "none" ]; then
            cfg -e KSU
            if [ "$KSU_VARIANT" = "xxksu" ] || [ "$KSU_VARIANT" = "foxmiko-ksu" ]; then
              cfg -d KPROBES -d HAVE_KPROBES -d KPROBE_EVENTS || true
              cfg -e KSU_TAMPER_SYSCALL_TABLE
            else
              if [ "$KSU_ENABLE_MODULES" = "true" ]; then cfg -e MODULES; fi
              cfg -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e OVERLAY_FS
            fi
          fi

          make "${MAKE_ARGS[@]}" olddefconfig
          make -j"$(nproc)" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

          BOOT="$OUT_DIR/arch/${TARGET_ARCH}/boot"
          if [ "$TARGET_ARCH" = "arm64" ]; then
            CANDIDATES="Image.gz-dtb Image.lz4-dtb Image.gz Image.lz4 Image"
          else
            CANDIDATES="zImage-dtb zImage"
          fi
          IMG=""
          for f in $CANDIDATES; do
            if [ -f "$BOOT/$f" ]; then IMG="$BOOT/$f"; break; fi
          done
          [ -n "$IMG" ] || { echo "::error::Binary Image kernel tidak ditemukan di $BOOT"; exit 1; }
          echo "IMG_PATH=$(pwd)/$IMG" >> "$GITHUB_ENV"
          if [ -f "$BOOT/dtbo.img" ]; then echo "DTBO_PATH=$(pwd)/$BOOT/dtbo.img" >> "$GITHUB_ENV"; fi

      - name: Siapkan nama dan folder hasil
        run: |
          DATE=$(date +%Y%m%d)
          case "$KSU_VARIANT" in
            xxksu)        KSU_TAG="-XXKSU" ;;
            ksu-next)     KSU_TAG="-KSUN" ;;
            ksu-original) KSU_TAG="-KSU" ;;
            foxmiko-ksu)  KSU_TAG="-FoxMiko" ;;
            *)            KSU_TAG="" ;;
          esac
          BASE_NAME="${KERNEL_NAME}-${CODENAME}-${KVER}-${DATE}${KSU_TAG}"
          echo "BASE_NAME=${BASE_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=build-${{ github.run_id }}" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "$IMG_PATH" "dist/${BASE_NAME}-$(basename "$IMG_PATH")"

      - name: Kemas AnyKernel3
        if: ${{ inputs.BUILD_ANYKERNEL3 }}
        run: |
          set -euo pipefail
          if [ -n "$AK3_REPO" ]; then
            git clone --depth=1 "$AK3_REPO" AnyKernel3
          else
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          fi
          rm -rf AnyKernel3/.git AnyKernel3/*.zip
          cp "$IMG_PATH" AnyKernel3/
          if [ -n "${DTBO_PATH:-}" ] && [ -f "$DTBO_PATH" ]; then
            cp "$DTBO_PATH" AnyKernel3/
          fi

          if [ -z "$AK3_REPO" ]; then
            AKS=AnyKernel3/anykernel.sh
            sed -i "s|^kernel.string=.*|kernel.string=${BASE_NAME}|" "$AKS"
            sed -i "s/^device.name1=.*/device.name1=${CODENAME}/" "$AKS"
            for n in 2 3 4 5; do sed -i "s|^device.name${n}=.*|device.name${n}=|" "$AKS"; done
            sed -i -E "s#^(BLOCK|block)=.*#\1=${AK3_BLOCK};#" "$AKS"
            sed -i -E "s#^(IS_SLOT_DEVICE|is_slot_device)=.*#\1=${AK3_SLOT_DEVICE};#" "$AKS"
            sed -i -E 's#^dump_boot;#split_boot;#; s#^write_boot;#flash_boot;#' "$AKS"
          fi

          (cd AnyKernel3 && zip -r9 "../dist/${BASE_NAME}.zip" . -x ".git*" -x "*.zip")

      - name: Unduh manager APK
        run: |
          set -uo pipefail
          mkdir -p dist
          latest() {
            local api tag url
            api=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest") || return 0
            tag=$(jq -r '.tag_name' <<<"$api")
            url=$(jq -r '[.assets[]? | select(.name|test("\\.apk$")) | select(.name|test("debug";"i")|not)][0].browser_download_url // empty' <<<"$api")
            [ -n "$url" ] && curl -fLsS -o "dist/Manager-$2-${tag}.apk" "$url" || true
          }
          if [ "$MANAGER_AUTO" = "true" ]; then
            case "$KSU_VARIANT" in
              ksu-next|foxmiko-ksu) latest KernelSU-Next/KernelSU-Next KernelSU-Next ;;
              xxksu|ksu-original) latest tiann/KernelSU KernelSU ;;
            esac
          fi

          EXTRA=",$(echo "$MGR_EXTRA" | tr 'A-Z' 'a-z' | tr -d ' '),"
          case "$EXTRA" in *,original,*) latest tiann/KernelSU KernelSU ;; esac
          case "$EXTRA" in *,next,*)     latest KernelSU-Next/KernelSU-Next KernelSU-Next ;; esac
          case "$EXTRA" in *,rksu,*)     latest rsuntk/KernelSU RKSU ;; esac
          case "$EXTRA" in *,kowsu,*)    latest KOWX712/KernelSU KowSU ;; esac

      - name: Upload artifact hasil
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}
          path: dist/*

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            kernel/build-full.log
            kernel/build.log
          if-no-files-found: ignore

      - name: Publish ke GitHub Release
        if: ${{ inputs.PUBLISH_RELEASE }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.BASE_NAME }}
          body: |
            Kernel: ${{ env.KERNEL_NAME }} (${{ env.KFULL }})
            Device: ${{ env.CODENAME }} | Arch: ${{ env.TARGET_ARCH }}
            Compiler: ${{ env.COMPILER }} | LTO: ${{ env.LTO_MODE }}
            KernelSU: ${{ env.KSU_VARIANT }}
            Commit source: ${{ env.KERNEL_COMMIT }}
          files: dist/*

      - name: Telegram - sukses (hasil + log)
        if: ${{ success() && env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        continue-on-error: true
        run: |
          source /tmp/tg.sh
          ELAPSED=$(( $(date +%s) - START_EPOCH ))
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tg_msg "✅ Build BERHASIL: ${BASE_NAME}
          Kernel   : ${KFULL}
          Compiler : ${COMPILER}
          LTO      : ${LTO_MODE}
          KernelSU : ${KSU_VARIANT}
          Durasi   : $((ELAPSED/60))m $((ELAPSED%60))s
          Run      : ${RUN_URL}"
          for f in dist/*; do
            tg_file "$f" "$(basename "$f") ($(du -h "$f" | cut -f1))"
          done
          LOG=kernel/build-full.log
          [ -f "$LOG" ] || LOG=kernel/build.log
          if [ -f "$LOG" ]; then
            sleep 2
            tg_file "$LOG" "Log lengkap build (mentah)"
          fi

      - name: Telegram - gagal (log)
        if: ${{ failure() && env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        continue-on-error: true
        run: |
          source /tmp/tg.sh
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tg_msg "❌ Build GAGAL: ${KERNEL_NAME} (${CODENAME})
          Cek log di: ${RUN_URL}"
          LOG=kernel/build-full.log
          [ -f "$LOG" ] || LOG=kernel/build.log
          if [ -f "$LOG" ]; then
            tg_file "$LOG" "Log error build (mentah)"
          fi
